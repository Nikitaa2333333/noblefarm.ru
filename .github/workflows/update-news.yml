name: Update VK News Feed

on:
  schedule:
    # Запуск каждые 12 часов (в 00:00 и 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Позволяет запускать вручную из веб-интерфейса GitHub Actions

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fetch VK News
        run: npm run fetch-news
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy vk-news.json to hosting (scp with retry)
        env:
          HOST: server66.hosting.reg.ru
          USER: ${{ secrets.HOSTING_USER }}
        run: |
          TARGET="/var/www/${USER}/data/www/noblefarm.ru/vk-news.json"
          for attempt in 1 2 3; do
            echo "::group::SCP attempt ${attempt}/3"
            if scp \
                -i ~/.ssh/id_deploy \
                -P 22 \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=10 \
                -o ServerAliveCountMax=3 \
                public/vk-news.json \
                "${USER}@${HOST}:${TARGET}"; then
              echo "::endgroup::"
              echo "SCP succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              echo "SCP attempt ${attempt} failed — retrying in 30s"
              sleep 30
            fi
          done
          echo "All 3 SCP attempts failed"
          exit 1
