name: Update VK News Feed

on:
  schedule:
    # Запуск каждые 12 часов (в 00:00 и 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Позволяет запускать вручную из веб-интерфейса GitHub Actions

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch VK News
        run: npm run fetch-news
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}

      - name: Deploy only vk-news.json to hosting via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: server66.hosting.reg.ru
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "public/vk-news.json"
          target: "/var/www/${{ secrets.HOSTING_USER }}/data/www/noblefarm.ru"
          strip_components: 1
          overwrite: true
